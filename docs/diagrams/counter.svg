<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="title">
  <title id="title">Счётчик кликов</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657896"/>
    </marker>
  </defs>
  <style>
    text { font: 600 16px system-ui, sans-serif; text-anchor: middle; }
    .label { font-size: 14px; fill: #36527d; paint-order: stroke; stroke: #f8faff; stroke-width: 6px; stroke-linejoin: round; }
  </style>
  <rect width="560" height="480" rx="12" fill="#f8faff"/>
  <g fill="none" stroke="#657896" stroke-width="1.7" stroke-linejoin="round">
    <polyline points="280,51 280,69" marker-end="url(#arrow)"/>
<polyline points="280,121 280,140" marker-end="url(#arrow)"/>
<polyline points="280,188 280,207" marker-end="url(#arrow)"/>
<polyline points="177.5,248 138,248 138,317" marker-end="url(#arrow)"/>
<polyline points="138,383 138,401 280,401"/>
<polyline points="382.5,248 422,248 422,317" marker-end="url(#arrow)"/>
<polyline points="422,383 422,401 280,401"/>
<polyline points="280,401 280,420" marker-end="url(#arrow)"/>
<polyline points="465,444 552,444 552,164 445,164" marker-end="url(#arrow)"/>
  </g>
  <g stroke-width="1.3">
    <rect x="202.5" y="13.0" width="155" height="38" rx="19.0" fill="#244fc8" stroke="#244fc8"/>
<text x="280" y="37.5" fill="white">Начало</text>
<rect x="115.0" y="69.0" width="330" height="52" rx="9" fill="#ffffff" stroke="#9eb1ce"/>
<text x="280" y="100.5" fill="#192538">Задать count = 0 и показать число</text>
<rect x="115.0" y="140.0" width="330" height="48" rx="9" fill="#e5edff" stroke="#8da7e5"/>
<text x="280" y="169.5" fill="#192538">Ждать клика по кнопке</text>
<polygon points="280,207.0 382.5,248 280,289.0 177.5,248" fill="#fff0ba" stroke="#b08725"/>
<text x="280" y="253.5" fill="#192538">Какая кнопка?</text>
<rect x="28.0" y="317.0" width="220" height="66" rx="9" fill="#ffffff" stroke="#9eb1ce"/>
<text x="138" y="355.5" fill="#192538">Прибавить 1 к count</text>
<rect x="312.0" y="317.0" width="220" height="66" rx="9" fill="#ffffff" stroke="#9eb1ce"/>
<text x="422" y="355.5" fill="#192538">Записать в count ноль</text>
<rect x="95.0" y="420.0" width="370" height="48" rx="9" fill="#e5edff" stroke="#8da7e5"/>
<text x="280" y="449.5" fill="#192538">Обновить число и кнопку сброса</text>
  </g>
  <text x="138" y="306" class="label">Клик</text>
<text x="422" y="306" class="label">Сброс</text>
</svg>
